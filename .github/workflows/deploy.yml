name: CI/CD Pipeline SIREKIPEMA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # TAHAP 1: CONTINUOUS INTEGRATION (TESTING)
  # ==========================================
  yss-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kesbangpol_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, bcmath, zip
        tools: composer:v2
        coverage: none

    # --- TAMBAHAN: SETUP NODE.JS & BUILD VITE ASSETS ---
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Menggunakan Node.js versi LTS stabil
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm install

    - name: Compile Frontend Assets (Vite)
      run: npm run build
    # ---------------------------------------------------

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache PHP Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Prepare Environment File for Testing
      run: |
        cp .env.example .env
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=kesbangpol_test/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Run Database Migrations for Testing
      run: php artisan migrate --force

    - name: Execute Automated Tests
      run: composer run test

  # ==========================================
  # TAHAP 2: CONTINUOUS DEPLOYMENT (AA PANEL)
  # ==========================================
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: yss-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Trigger aaPanel Webhook Deployment
      run: |
        echo "Mengirimkan instruksi deployment ke aaPanel..."
        curl -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}"
